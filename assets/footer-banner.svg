<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="100%" style="background: transparent; overflow: hidden; border-radius: 14px;">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0e1022" />
      <stop offset="100%" stop-color="#140b26" />
    </linearGradient>
    <linearGradient id="footer-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="f-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <rect width="1200" height="120" rx="14" fill="url(#footer-bg)" />
  <circle cx="200" cy="60" r="80" fill="#38bdf8" opacity="0.12" filter="url(#f-glow)" />
  <circle cx="1000" cy="60" r="80" fill="#c084fc" opacity="0.12" filter="url(#f-glow)" />
  <rect x="1" y="1" width="1198" height="118" rx="13" fill="none" stroke="url(#footer-border)" stroke-width="1.5" opacity="0.75" />

  <!-- Animated Wave Line -->
  <path d="M 50 60 Q 300 30 600 60 T 1150 60" fill="none" stroke="url(#text-grad)" stroke-width="2" opacity="0.4" />

  <text x="600" y="55" text-anchor="middle" fill="url(#text-grad)" font-size="19" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="2">
    SOLUTION TECH &bull; CRAFTED WITH PASSION, PRECISION &amp; PERFORMANCE
  </text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="1">
    © 2026 Solution Tech. Delivering scalable web platforms &amp; AI engineering worldwide.
  </text>
</svg>
